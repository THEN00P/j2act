server.port=8080
# Retained State snapshots go to the app's DataSource, an H2 file here, so drafts saved on
# shutdown are there after a restart. The table comes from the script j2act-retained-jdbc ships,
# as a migration tool would run it (ADR 0026). H2 stays open until Spring closes the pool, after
# j2act has saved.
spring.datasource.url=jdbc:h2:file:${java.io.tmpdir}/j2act-counter-demo;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:j2act/jdbc/schema-h2.sql
